# CNB e2e 验证：skill 模板 cnb-ci.yml 改造版（runner.cpus: 1 按皇上要求）
main:
  push:
    - name: ci-build
      runner:
        cpus: 1
      docker:
        image: node:20
      stages:
        - name: install
          script: npm install --no-audit --no-fund
        - name: build
          script: npm run build
        - name: test
          script: npm test
      failStages:
        - name: notify-failure
          script: echo "build failed at stage ${CNB_BUILD_FAILED_STAGE_NAME} msg ${CNB_BUILD_FAILED_MSG}"

# api_trigger 验证入口（供 CI 触发 e2e 复现）
$:  # 仓库级事件挂 $ 键（skill 红线 2）
  api_trigger:
    - name: api-e2e
      runner:
        cpus: 1
      docker:
        image: node:20
      stages:
        - name: install
          script: npm install --no-audit --no-fund
        - name: build
          script: npm run build
        - name: test
          script: npm test
